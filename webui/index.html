<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>EpicTope — epitope tag insertion site prediction</title>
  <script>
    // Resolve the theme before first paint (no light-mode flash for dark
    // users): stored choice, else OS colour scheme, else light. Must match
    // src/theme.ts resolution.
    try {
      var t = localStorage.getItem("epictope.theme");
      if (t !== "light" && t !== "dark")
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = "light"; }
  </script>
  <link rel="stylesheet" href="./src/style.css"/>
</head>
<body>
  <header class="top">
    <h1>EpicTope</h1>
    <span class="tagline">Predict non-disruptive epitope tag insertion sites</span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main>
    <section id="searchZone" class="searchzone">
      <div id="search"></div>
      <div id="runPanel"></div>
      <div id="errorBox"></div>
    </section>
    <section id="results" hidden>
      <div id="reshead" class="card reshead"></div>
      <div class="card" id="chartCard"></div>
      <div class="card" id="msaCard"></div>
    </section>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
